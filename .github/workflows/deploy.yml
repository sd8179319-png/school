name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract website source
        run: unzip -q 'wisdom-school-fee-&-van-fee-portal.zip' -d site-source
      - name: Configure GitHub Pages asset paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          config = Path('site-source/vite.config.ts')
          source = config.read_text()
          source = source.replace('return {\n', "return {\n    base: '/school/',\n", 1)
          config.write_text(source)
          PY
      - name: Install dependencies
        run: npm --prefix site-source install --legacy-peer-deps
      - name: Build website
        run: npm --prefix site-source run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
